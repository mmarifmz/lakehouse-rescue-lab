resources:
  jobs:
    lakehouse_rescue_job:
      name: "[${bundle.target}] Lakehouse Rescue Lab"
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: rescue_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            autoscale:
              min_workers: 1
              max_workers: 2
            data_security_mode: USER_ISOLATION
      tasks:
        - task_key: transform_orders
          job_cluster_key: rescue_cluster
          spark_python_task:
            python_file: ../src/pipeline.py
        - task_key: refresh_gold_mart
          depends_on:
            - task_key: transform_orders
          job_cluster_key: rescue_cluster
          spark_python_task:
            python_file: ../src/refresh_gold.py
      tags:
        project: lakehouse-rescue-lab
        layer: medallion
