[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-rescue-lab"
version = "0.1.0"
description = "Production-minded Databricks lakehouse delivery demonstration"
requires-python = ">=3.10"
dependencies = ["pyspark>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
